  - pandas>=2.0
  - numpy>=1.26
  - scipy>=1.11
  - matplotlib>=3.8
  - seaborn>=0.13
  - networkx
  # Notebook + utilities
  - jupyterlab
  - tqdm
  - requests
  - pyyaml
  - click
