  - python=3.11
  - pip
  # Structural biology
  - biopython>=1.83
  - mdanalysis>=2.7
  - rdkit>=2024.03
  - openbabel>=3.1
  - pymol-open-source
  # Docking
  - vina>=1.2.5
  - meeko>=0.5
