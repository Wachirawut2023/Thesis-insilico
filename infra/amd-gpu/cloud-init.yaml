#cloud-config
# DigitalOcean AMD GPU Droplet (MI300X, ROCm) bootstrap for Tier-3 MD.
# Assumes the "AI/ML Ready" AMD GPU Droplet image (Ubuntu 22.04 + ROCm
# preinstalled). GROMACS is built from source with HIP support since no
# AMD-GPU GROMACS package is available via conda-forge/apt.

package_update: true
package_upgrade: false
packages:
  - build-essential
  - cmake
  - ninja-build
  - git
  - curl
  - tmux
  - htop
  - rsync
  - unzip
  - jq
  - libfftw3-dev

write_files:
  - path: /opt/bootstrap.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -eo pipefail
      exec > >(tee -a /var/log/bootstrap.log) 2>&1
      echo "[amd-bootstrap] starting $(date -Is)"

      GROMACS_VERSION="${GROMACS_VERSION:-2024.3}"
      WORK_DIR="${WORK_DIR:-/opt/Thesis-insilico}"
      REPO_URL="${REPO_URL:-https://github.com/Wachirawut2023/Thesis-insilico.git}"
      BRANCH="${BRANCH:-main}"

      rocminfo | grep -i "gfx" || { echo "ERROR: no AMD GPU visible via rocminfo"; exit 1; }
      AMDGPU_TARGET="$(rocminfo | grep -o 'gfx[0-9a-z]*' | sort -u | head -1)"
      echo "[amd-bootstrap] detected GPU target: $AMDGPU_TARGET"

      if [ ! -d /opt/miniforge ]; then
        curl -L -o /tmp/miniforge.sh \
          "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh"
        bash /tmp/miniforge.sh -b -p /opt/miniforge
        rm /tmp/miniforge.sh
      fi
      export PATH="/opt/miniforge/bin:$PATH"
      source /opt/miniforge/etc/profile.d/conda.sh

      if ! conda env list | grep -q '^md'; then
        mamba create -n md -c conda-forge -y \
          python=3.11 mdanalysis freesasa biopython matplotlib \
          pandas numpy scipy tqdm pyyaml
      fi
      conda activate md

      if ! command -v gmx >/dev/null 2>&1 || ! gmx --version 2>&1 | grep -qi "HIP"; then
        echo "[amd-bootstrap] building GROMACS $GROMACS_VERSION with HIP for $AMDGPU_TARGET"
        cd /opt
        if [ ! -d "gromacs-${GROMACS_VERSION}" ]; then
          curl -L -o gromacs.tar.gz \
            "https://ftp.gromacs.org/gromacs/gromacs-${GROMACS_VERSION}.tar.gz"
          tar xzf gromacs.tar.gz
          rm gromacs.tar.gz
        fi
        cd "gromacs-${GROMACS_VERSION}"
        mkdir -p build && cd build
        cmake .. \
          -DGMX_GPU=HIP \
          -DGMX_HIP_TARGET_ARCH="$AMDGPU_TARGET" \
          -DCMAKE_PREFIX_PATH=/opt/rocm \
          -DGMX_BUILD_OWN_FFTW=ON \
          -DGMX_MPI=OFF \
          -DCMAKE_INSTALL_PREFIX=/opt/gromacs \
          -DCMAKE_BUILD_TYPE=Release
        make -j"$(nproc)"
        make install
        cd /
      fi
      source /opt/gromacs/bin/GMXRC

      gmx --version 2>&1 | grep -E "GROMACS|GPU support|HIP" || true

      if [ ! -d "$WORK_DIR" ]; then
        git clone "$REPO_URL" "$WORK_DIR"
      fi
      cd "$WORK_DIR"
      git fetch origin
      git checkout "$BRANCH"
      git pull --ff-only
      chmod +x scripts/md/run_md.sh scripts/md/run_all.sh
      chmod -R a+rX "$WORK_DIR"

      cat > /etc/profile.d/md-env.sh <<'EOF2'
      export PATH="/opt/miniforge/bin:$PATH"
      source /opt/miniforge/etc/profile.d/conda.sh
      conda activate md 2>/dev/null || true
      source /opt/gromacs/bin/GMXRC
      EOF2

      echo "[amd-bootstrap] done $(date -Is)"

  - path: /root/.tmux.conf
    permissions: "0644"
    content: |
      set -g history-limit 50000
      set -g mouse on

runcmd:
  - [ bash, -lc, "bash /opt/bootstrap.sh" ]
  - [ bash, -lc, "echo bootstrap-complete > /opt/.bootstrap-complete" ]

final_message: "AMD GPU bootstrap complete after $UPTIME seconds. See /var/log/bootstrap.log"
